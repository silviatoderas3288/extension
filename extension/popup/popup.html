<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airbnb Compare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #222;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .header-logo {
      color: #FF395C;
      font-size: 22px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }

    .header-subtitle {
      font-size: 12px;
      color: #888;
    }

    .status {
      padding: 14px 16px;
    }

    .status-count {
      font-size: 28px;
      font-weight: 700;
      color: #FF395C;
      line-height: 1;
    }

    .status-label {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .progress-bar {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .progress-dot {
      flex: 1;
      height: 4px;
      background: #f0f0f0;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .progress-dot--filled {
      background: #FF395C;
    }

    .listings-list {
      padding: 0 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .listing-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #f9f9f9;
      border-radius: 10px;
      font-size: 13px;
    }

    .listing-item-photo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      background: #e0e0e0;
      flex-shrink: 0;
    }

    .listing-item-info {
      flex: 1;
      min-width: 0;
    }

    .listing-item-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .listing-item-price {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }

    .listing-item-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 16px;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .listing-item-remove:hover {
      color: #FF395C;
    }

    .empty-state {
      padding: 20px 16px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
    }

    .footer-btn {
      width: 100%;
      height: 38px;
      background: #FF395C;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .footer-btn:hover {
      background: #e0304f;
    }

    .footer-btn:disabled {
      background: #f0f0f0;
      color: #aaa;
      cursor: not-allowed;
    }

    .tip {
      padding: 10px 16px 14px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-logo">♡</span>
    <div>
      <div class="header-title">Wishlist Compare</div>
      <div class="header-subtitle">Airbnb Quick Comparison</div>
    </div>
  </div>

  <div class="status">
    <div class="status-count" id="selected-count">0</div>
    <div class="status-label">listings selected (max 3)</div>
    <div class="progress-bar">
      <div class="progress-dot" id="dot-0"></div>
      <div class="progress-dot" id="dot-1"></div>
      <div class="progress-dot" id="dot-2"></div>
    </div>
  </div>

  <div class="listings-list" id="listings-list">
    <!-- populated by popup.js -->
  </div>

  <div class="empty-state" id="empty-state" style="display:none;">
    <span class="empty-icon">🏡</span>
    Open an Airbnb wishlist and tap the check icon on listings to select up to 3 to compare.
  </div>

  <div class="footer">
    <button class="footer-btn" id="compare-btn" disabled>Compare Now</button>
  </div>

  <div class="tip" id="tip">Navigate to an Airbnb wishlist to get started.</div>

  <script src="popup.js"></script>
</body>
</html>
